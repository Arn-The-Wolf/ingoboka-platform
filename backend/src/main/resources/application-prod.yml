spring:
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration

app:
  storage:
    provider: s3
  sms:
    provider: http
  payment:
    provider: momo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    rw.ingoboka: INFO
